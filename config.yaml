# 源文件夹路径（支持中文和Windows路径）
source_folder: "D:/学生文档"

# 输出文件路径
output_file: "D:/学生信息汇总.xlsx"

# 表头所在行（默认为0）
header_row: 0

# 信息提取规则（使用正则表达式）
extraction_patterns:
  姓名:
    - "姓名[:：]\\s*(\\w+)"
    - "姓名[:：]\\s*([\\u4e00-\\u9fa5]{2,4})"

  学号:
    - "学号[:：]\\s*(\\d{8,12})"
    - "student[ _]?id[:：]?\\s*(\\d{8,12})"

  日期:
    - "日期[:：]\\s*(\\d{4}[-/年]\\d{1,2}[-/月]\\d{1,2}日?)"
    - "date[:：]\\s*(\\d{4}[-/]\\d{1,2}[-/]\\d{1,2})"

  班级:
    - "班级[:：]\\s*([\\u4e00-\\u9fa5]{2,4}\\d{1,2}班)"
    - "class[:：]\\s*([\\w\\d]+)"